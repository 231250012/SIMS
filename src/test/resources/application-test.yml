spring:
  # Test Database Configuration (H2 in-memory)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # JPA Configuration for Testing
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Disable Flyway for tests (use JPA schema generation instead)
  flyway:
    enabled: false
  
  # Disable Redis for tests
  data:
    redis:
      host: localhost
      port: 6379
      database: 15
      timeout: 2000ms
  
  # Kafka Configuration for Testing (mock values)
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: test-group
  
  # Disable Kafka auto-configuration for tests
  # Redis 保持启用：Lettuce 懒连接，contextLoads 可不依赖本机 Redis；
  # 涉及会话/计数的用例需先执行: docker compose up -d redis
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration

# Logging Configuration for Testing
logging:
  level:
    com.sims: DEBUG
    org.springframework.kafka: WARN
    org.springframework.data.redis: WARN
    org.hibernate.SQL: DEBUG

# Application specific configuration for testing
app:
  jwt:
    secret: test-secret-key-for-testing-purposes-only-not-for-production-use
    expiration: 3600000 # 1 hour for testing
  
  file:
    upload-dir: ./test-uploads
    max-size: 5MB
  
  cache:
    ttl: 60 # 1 minute for testing