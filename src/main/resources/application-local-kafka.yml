# 本地联调 + Docker Kafka
# 启动：mvn spring-boot:run -Dspring-boot.run.profiles=local-kafka
# 依赖：docker compose up -d mysql redis zookeeper kafka
server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3307/sims_dev?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true
    username: sims
    password: sims123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms

  kafka:
    bootstrap-servers: localhost:9092,localhost:9093
    consumer:
      group-id: sims-grade-consumer-group-local
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      retries: 3
      batch-size: 16384
      linger-ms: 5

kafka:
  topic:
    grade-updates: grade-updates
    grade-updates-dlq: grade-updates-dlq
    partitions: 3
    replication-factor: 2

logging:
  level:
    com.sims: DEBUG
    org.springframework.kafka: INFO

app:
  jwt:
    secret: local-dev-secret-key-that-should-be-at-least-256-bits-long-for-hs256
    expiration: 1800000
  file:
    upload-dir: ./uploads/local
    max-size: 10MB
  cache:
    ttl: 300
