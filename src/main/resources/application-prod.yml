spring:
  # Database Configuration
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/sims_prod?useSSL=true&serverTimezone=UTC}
    username: ${DB_USERNAME:sims_user}
    password: ${DB_PASSWORD:sims_password}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  # Redis Configuration
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # Kafka Configuration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 5
      batch-size: 16384
      linger-ms: 5
      buffer-memory: 33554432
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:sims-prod-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: "com.sims.kafka.dto"
    listener:
      ack-mode: manual_immediate
  
  # JPA Configuration for Production
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        use_sql_comments: false
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true

# Logging Configuration for Production
logging:
  level:
    com.sims: INFO
    org.springframework.kafka: WARN
    org.hibernate.SQL: WARN
  file:
    name: /var/log/sims/application.log
  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 30

# Application specific configuration
app:
  jwt:
    secret: ${JWT_SECRET:production-secret-key-must-be-changed-and-be-at-least-256-bits-long-for-security}
    expiration: ${JWT_EXPIRATION:1800000} # 30 minutes in milliseconds
  
  file:
    upload-dir: ${FILE_UPLOAD_DIR:/var/sims/uploads}
    max-size: ${FILE_MAX_SIZE:10MB}
  
  cache:
    ttl: ${CACHE_TTL:1800} # 30 minutes in seconds

# Management endpoints for production
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never